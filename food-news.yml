name: Food News Bot

on:
  schedule:
    # UTC. 11h/15h/21h UTC = 08h/12h/18h em Brasília
    - cron: "0 11,15,21 * * *"
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: write      # para salvar o seen.json (histórico)

concurrency: food-news

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar e enviar notícias
        run: python news_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_ITEMS: "8"

      - name: Salvar histórico
        run: |
          git config user.name "food-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "atualiza histórico" && git push)
